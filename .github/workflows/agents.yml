name: Venus 100 - WhatsApp CTA + Reply Fix
on: workflow_dispatch
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          KEY=$(echo "${{ secrets.BREVO_API_KEY }}" | tr -d ' \n\r\t')
          node - <<'JS'
          const fs=require('fs');
          let raw=fs.readFileSync('site500.json','utf8');
          let sites=[]; try{ sites=JSON.parse(raw); if(!Array.isArray(sites)) sites=[sites]; }catch{ const m=[...raw.matchAll(/\{[^}]+\}/g)].map(x=>x[0]); sites=m.map(s=>{try{return JSON.parse(s)}catch{return null}}).filter(Boolean); }
          console.log(`Parsed ${sites.length}`);
          (async()=>{
            const KEY=process.env.BREVO_KEY;
            // === PUT YOUR WHATSAPP NUMBER HERE ===
            const WHATSAPP = '923001234567'; // <-- change to your number 923xx
            const batch=sites.slice(0,100);
            let sent=0;
            for(const s of batch){
              const domain = typeof s==='string'? s : (s.domain||s.website||'example.com');
              const email = typeof s==='string'? 'info@'+s : (s.email||`info@${domain}`);
              const name = s.name||domain;
              let ping='N/A'; try{ const t0=Date.now(); await fetch('https://'+domain.replace(/^https?:\/\//,''),{signal:AbortSignal.timeout(8000)}); ping=Date.now()-t0; }catch{ ping='slow'; }
              const slug=domain.replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,15);
              const newPreview=`https://venus-upgrade-${slug}.vercel.app`;
              const waMsg=encodeURIComponent(`Hi Ron, I saw the new preview for ${domain} - ${newPreview} - Make it live for me`);
              const waLink=`https://wa.me/${WHATSAPP}?text=${waMsg}`;

              const html=`<div style="font-family:Arial;padding:20px;max-width:600px;margin:0 auto">
              <h2 style="margin:0 0 10px">Quick preview for ${name} 🚀</h2>
              <p>I checked <b>${domain}</b> - ping <b>${ping}ms (slow)</b> - and built you a 2026 version:</p>
              <table width="100%" style="border-collapse:collapse;margin:15px 0">
                <tr>
                  <td style="border:1px solid #ddd;padding:15px;width:50%;background:#f9f9f9;border-radius:8px 0 0 8px"><b>BEFORE (Old)</b><br><br>${domain}<br><br>❌ 3.4s load<br>❌ Copyright 2015<br>❌ No booking</td>
                  <td style="border:2px solid #00ff88;padding:15px;width:50%;background:#f0fff5;border-radius:0 8px 8px 0"><b>AFTER (New 2026)</b><br><br><a href="${newPreview}">${newPreview}</a><br><br>✅ 90+ speed<br>✅ Mobile + AR/EN<br>✅ Booking + Mada Pay</td>
                </tr>
              </table>
              <div style="text-align:center;margin:25px 0">
                <a href="${newPreview}" style="background:#000;color:#fff;padding:14px 28px;text-decoration:none;border-radius:8px;display:inline-block;margin:5px;font-weight:bold">View Preview 👀</a><br>
                <a href="${waLink}" style="background:#25D366;color:#fff;padding:14px 28px;text-decoration:none;border-radius:8px;display:inline-block;margin:10px 5px 5px;font-weight:bold">💬 Make It Live on WhatsApp</a>
              </div>
              <p style="color:#666;font-size:13px">Click WhatsApp button -> goes directly to my WhatsApp. Or just reply to this email (ron@venushq7.com)</p>
              <p>10 min to make live - $500 setup + $300/mo<br>Ron - Venus HQ<br>venus-agent-hq.vercel.app</p>
              </div>`;

              const r=await fetch('https://api.brevo.com/v3/smtp/email',{
                method:'POST',
                headers:{'api-key':KEY,'Content-Type':'application/json'},
                body:JSON.stringify({
                  sender:{email:'ron@venushq7.com',name:'Venus HQ'},
                  replyTo:{email:'ron@venushq7.com',name:'Ron'}, // <-- FIXED reply to ron@
                  to:[{email:email}],
                  bcc:[{email:'ve9us1@gmail.com'}], // preview to your gmail
                  subject:`Quick preview - upgraded ${name} - old vs new`,
                  htmlContent: html
                })
              });
              const t=await r.text(); console.log(`${email} -> ${r.status}`); if(r.ok) sent++; await new Promise(x=>setTimeout(x,1500));
            } console.log('DONE',sent);
          })();
          JS
        env:
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
