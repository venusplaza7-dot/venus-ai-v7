name: venus-test-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send Test Luxury Email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          node << 'NODE'
          (async () => {
            const client = "Alliance Plumbing Houston";
            const html = '<div style="max-width:600px;margin:0 auto;background:#ffffff;font-family:Georgia,serif;color:#111;border:1px solid #eaeaea"><div style="padding:32px"><p style="font-size:11px;letter-spacing:2px;color:#888;margin:0 0 10px 0">VENUS HQ — PRIVATE AUDIT FOR '+client.toUpperCase()+'</p><h1 style="font-size:26px;font-weight:400;line-height:1.2;margin:0 0 16px 0">Your site is unchanged since 2016 — losing Gen Z.</h1><p style="font-family:Arial;font-size:15px;line-height:1.6">Hi '+client+' team,<br><br>We reviewed your site. 3 quick findings: 1) 2016 design, no trust above fold 2) Mobile UX fails Gen Z 3) No AI instant quote / booking.<br><br><b>Who we are:</b> Venus HQ — we rebuild home-service sites into luxury AI converters.</p><a href="https://venus-agent-hq.vercel.app" style="display:inline-block;background:#111;color:#fff;padding:14px 28px;text-decoration:none;font-family:Arial;font-size:13px;letter-spacing:1px;margin:16px 0">VIEW PRIVATE PREVIEW →</a><p style="font-family:Arial;font-size:12px;color:#888">Reply VENUS for full site. — Ron, ron@venushq7.com</p></div></div>';
            const r = await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'api-key':process.env.BREVO_API_KEY,'Content-Type':'application/json'},body:JSON.stringify({sender:{name:'Ron — Venus HQ',email:'ron@venushq7.com'},to:[{email:'ve9us1@gmail.com'}],subject:client+' — audit + preview (2016 → 2026)',htmlContent:html})});
            console.log('STATUS',r.status,await r.text());
          })();
          NODE
