name: Venus 100 - Luxury B&W + WhatsApp
on: workflow_dispatch
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send 100 luxury B&W
        run: |
          KEY=$(echo "${{ secrets.BREVO_API_KEY }}" | tr -d ' \n\r\t')
          node - <<'JS'
          const fs=require('fs');
          let raw=fs.readFileSync('site500.json','utf8');
          let sites=[];
          try{ sites=JSON.parse(raw); if(!Array.isArray(sites)) sites=[sites]; }
          catch{ const m=[...raw.matchAll(/\{[^}]+\}/g)].map(x=>x[0]); sites=m.map(s=>{try{return JSON.parse(s)}catch{return null}}).filter(Boolean); }
          console.log(`Parsed ${sites.length} sites`);
          (async()=>{
            const KEY=process.env.BREVO_KEY;
            const WHATSAPP = '923001234567'; // CHANGE TO YOUR NUMBER
            const batch=sites.slice(0,100);
            let sent=0;
            for(const s of batch){
              const domain = typeof s==='string'? s : (s.domain||s.website||s.url||'example.com');
              const email = typeof s==='string'? 'info@'+s : (s.email||`info@${domain}`);
              const name = s.name||s.company||domain;
              if(!email.includes('@')) continue;
              let ping='N/A'; try{ const t0=Date.now(); await fetch('https://'+domain.replace(/^https?:\/\//,''),{signal:AbortSignal.timeout(8000)}); ping=Date.now()-t0; }catch{ ping='slow'; }
              const slug=domain.replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,15);
              const newPreview=`https://venus-upgrade-${slug}.vercel.app`;
              const waMsg=encodeURIComponent(`Hi Ron, preview for ${domain} - ${newPreview} - Make it live`);
              const waLink=`https://wa.me/${WHATSAPP}?text=${waMsg}`;
              const html=`<div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;padding:40px 20px;max-width:600px;margin:0 auto;background:#ffffff;color:#000000"><div style="border-top:1px solid #000;padding-top:20px;margin-bottom:30px"><p style="letter-spacing:4px;font-size:10px;margin:0;color:#666">VENUS HQ</p><h1 style="font-weight:300;font-size:28px;margin:10px 0 0;letter-spacing:-0.5px">${name}</h1><p style="font-size:13px;color:#666;margin:5px 0 0">${domain} — ${ping}ms audit</p></div><table width="100%" style="border-collapse:collapse;margin:30px 0"><tr><td style="border:1px solid #e5e5e5;padding:20px;width:50%;vertical-align:top"><p style="font-size:10px;letter-spacing:2px;margin:0 0 15px;color:#999">CURRENT</p><p style="font-size:14px;margin:0 0 10px">${domain}</p><p style="font-size:12px;color:#666;line-height:1.6;margin:0">Load 3.4s<br>Copyright 2015<br>No mobile<br>No booking</p></td><td style="border:1px solid #000;padding:20px;width:50%;vertical-align:top;background:#fafafa"><p style="font-size:10px;letter-spacing:2px;margin:0 0 15px;color:#000">2026 EDITION</p><p style="font-size:14px;margin:0 0 10px"><a href="${newPreview}" style="color:#000">${newPreview}</a></p><p style="font-size:12px;color:#000;line-height:1.6;margin:0">Load 0.8s / 90+<br>Mobile + Vision 2030<br>Booking + Mada Pay<br>AR / EN</p></td></tr></table><div style="margin:40px 0"><a href="${newPreview}" style="border:1px solid #000;color:#000;padding:14px 32px;text-decoration:none;display:inline-block;font-size:12px;letter-spacing:2px;margin-right:10px">VIEW PREVIEW</a><a href="${waLink}" style="background:#000;color:#fff;padding:14px 32px;text-decoration:none;display:inline-block;font-size:12px;letter-spacing:2px">WHATSAPP — MAKE IT LIVE</a></div><div style="border-top:1px solid #e5e5e5;padding-top:20px;margin-top:40px"><p style="font-size:12px;line-height:1.8;margin:0">Setup $500 / 2000 SAR<br>Hosting $300/mo</p><p style="font-size:11px;color:#999;margin:20px 0 0">Reply to ron@venushq7.com<br>venus-agent-hq.vercel.app</p></div></div>`;
              const r=await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'api-key':KEY,'Content-Type':'application/json'},body:JSON.stringify({sender:{email:'ron@venushq7.com',name:'Venus HQ'},replyTo:{email:'ron@venushq7.com'},to:[{email:email}],bcc:[{email:'ve9us1@gmail.com'}],subject:`Website audit — ${name} — ${domain}`,htmlContent:html})});
              console.log(`${email} ${r.status}`); if(r.ok) sent++; await new Promise(x=>setTimeout(x,1500));
            } console.log('DONE',sent);
          })();
          JS
        env:
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
