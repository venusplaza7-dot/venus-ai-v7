name: Venus - Old Site Hunter
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours hunt
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Hunt Old 2016 Sites and Build Proposal
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OWNER_EMAIL: ve9us1@gmail.com
          SENDER_EMAIL: ron@venushq7.com
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }} # add free key from serpapi.com
        run: |
          cat > hunter.js <<'JS'
          const niches = ["plumber Houston","cafe Riyadh","salon Dubai","roofing Austin","dentist Miami"];
          const query = niches[Math.floor(Math.random()*niches.length)];
          console.log('HUNTING:', query);

          // 1. SEARCH - using SerpAPI (free 100 searches)
          let results = [];
          try {
            const serp = await fetch(`https://serpapi.com/search.json?engine=google&q=${encodeURIComponent(query)}&num=10&api_key=${process.env.SERPAPI_KEY}`).then(r=>r.json());
            results = serp.organic_results?.map(r=>r.link) || [];
          } catch(e){ console.log('SERP fail, using fallback'); results = [`https://${query.replace(' ','')} .com`.replace(' ','')] }

          for(const url of results.slice(0,5)){
            try {
              console.log('CHECKING', url);
              const html = await fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}, signal: AbortSignal.timeout(8000)}).then(r=>r.text()).catch(()=>null);
              if(!html) continue;

              // 2. DETECT OLD 2016 SITE
              const isOld = 
                !html.includes('viewport') ||
                html.includes('<table') && html.includes('cellpadding') ||
                html.includes('jquery-1.') ||
                /Copyright.*20(1[0-5]|16)/i.test(html) ||
                !html.includes('flex') && !html.includes('grid');

              console.log(url, 'IS OLD?', isOld);
              if(!isOld) continue;

              // 3. EXTRACT INFO AUTOMATICALLY
              const nameMatch = html.match(/<title>(.*?)<\/title>/i) || html.match(/<h1>(.*?)<\/h1>/i);
              const name = nameMatch ? nameMatch[1].replace(/Home|Welcome|-/g,'').trim().slice(0,35) : url.replace('https://','').split('.')[0];
              const emailMatch = html.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i);
              const email = emailMatch ? emailMatch[0] : null;
              const city = query.split(' ').slice(-1)[0];
              const slug = 'venus-' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,30);

              if(!email) { console.log('No email found, skip'); continue; }

              console.log('FOUND OLD CLIENT:', {name, url, email, city, slug});

              // 4. BUILD PROPOSAL EMAIL WITH OLD vs NEW
              const liveUrl = `https://venus-hq.vercel.app/${slug}`;
              const oldShot = `https://image.thum.io/get/width/700/crop/900/noanimate/${url}`;
              const newShot = `https://image.thum.io/get/width/700/crop/900/noanimate/${liveUrl}`;

              const htmlEmail = `<!DOCTYPE html><body style="margin:0;background:#f4f4f4;font-family:Arial"><div style="max-width:680px;margin:auto;background:#fff">
              <div style="background:#000;padding:30px;text-align:center"><h1 style="color:#fff;letter-spacing:10px;font-weight:200;margin:0">VENUS HQ</h1><p style="color:#777;font-size:10px;letter-spacing:4px">PRIVATE PROPOSAL — FOUND YOUR 2016 SITE</p></div>
              <div style="padding:35px"><h1 style="font-size:42px;font-weight:300">Your new website<br><b style="font-weight:900">is ready for review.</b></h1>
              <p>Hi <b>${name}</b>,</p>
              <p>We came across your website <b>${url}</b> while researching top businesses in <b>${city}</b>, and we found it <b>very old — HTML from 2016 or before, not mobile ready.</b></p>
              <p>In today's world, <b>Gen Z doesn't call — they click.</b> With AI booking, voice search, visual quotes one click away, your old HTML table layout is costing you 70% leads to competitors.</p>
              <p>So we rebuilt it for you — luxury Black & White — already live.</p></div>
              <table width="100%" style="border:1px solid #000"><tr>
              <td width="50%" style="padding:10px;background:#fafafa;text-align:center"><p style="color:#c00;font-weight:900">❌ YOUR 2016 OLD SITE</p><img src="${oldShot}" style="width:100%"><p style="font-size:11px">Found: No viewport, table layout, jQuery 1.x</p></td>
              <td width="50%" style="padding:10px;background:#000;text-align:center"><p style="color:#0f8;font-weight:900">✅ NEW LUXURY AI WE BUILT</p><img src="${newShot}" style="width:100%;border:2px solid #fff"><p style="font-size:11px;color:#fff">AI Concierge • Visual Quote • Voice Booking</p></td>
              </tr></table>
              <div style="padding:30px;text-align:center"><p style="color:#888;letter-spacing:3px;font-size:11px">CONCEPT — ${city.toUpperCase()}</p><h2>${name}</h2><a href="${liveUrl}" style="background:#000;color:#fff;padding:18px 36px;text-decoration:none;font-weight:900">VIEW LIVE PROPOSAL →</a><p style="font-size:13px;color:#666;margin-top:15px">Crystal clear: Old vs New side by side above. Click to see live.</p></div>
              <div style="background:#000;padding:25px;text-align:center"><p style="color:#fff;font-size:18px;margin:0">Reply via WhatsApp to launch within 24 hours.</p><p style="color:#888">+1 (786) 588-0578 | ron@venushq7.com</p></div>
              </div></body></html>`;

              // 5. SEND TO OWNER FOR FIRST 10 APPROVALS
              const fs=require('fs');
              let count=0; try{count=parseInt(fs.readFileSync('sent_count.txt','utf8'))||0}catch{}
              const isFirst10 = count < 10;
              const to = isFirst10 ? process.env.OWNER_EMAIL : email;
              const subject = isFirst10 ? `[APPROVAL ${count+1}/10] FOUND OLD 2016 SITE: ${name} — ${url}` : `${name} — We found your site from 2016, rebuilt it in Luxury AI`;

              console.log(`SENDING TO ${to} - First10=${isFirst10}`);
              const res = await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'accept':'application/json','api-key':process.env.BREVO_API_KEY,'content-type':'application/json'},body:JSON.stringify({sender:{name:'Ron - Venus HQ',email:process.env.SENDER_EMAIL},to:[{email:to}],subject,htmlContent:htmlEmail})}).then(r=>r.text().then(t=>[r.status,t]));
              console.log('BREVO', res);

              if(isFirst10){
                fs.writeFileSync('sent_count.txt', String(count+1));
                // save found client for dynamic page
                let db=[]; try{db=JSON.parse(fs.readFileSync('clients.json','utf8'))}catch{}
                db.push({id:count+1,name,website:url,email,city,niche:query,slug,status:'pending_approval', found_at: new Date().toISOString()});
                fs.writeFileSync('clients.json', JSON.stringify(db,null,2));
              }
              process.exit(0); // send 1 per run
            } catch(e){ console.error('ERR', url, e.message); }
          }
          JS
          node hunter.js
