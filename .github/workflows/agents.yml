name: Venus - First Approval Then Autonomous

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install @getbrevo/brevo

      - name: Send Luxury Proposal
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OWNER_EMAIL: ve9us1@gmail.com
        run: |
          const brevo = require('@getbrevo/brevo');
          const api = new brevo.TransactionalEmailsApi();
          api.setApiKey(0, process.env.BREVO_API_KEY);

          // LUXURY TEMPLATE - Easy to change
          const client = {
            name: "Houston Elite Plumber",
            website: "https://old-plumber-example.com",
            city: "Houston, TX",
            niche: "Plumber"
          };

          const html = `
          <!DOCTYPE html>
          <html><body style="margin:0;background:#000;color:#fff;font-family:Arial">
            <div style="background:#000;padding:30px;text-align:center;border-bottom:2px solid #fff">
              <h1 style="letter-spacing:5px;margin:0">VENUS AI</h1>
              <p style="color:#888">LUXURY BLACK & WHITE EDITION</p>
            </div>
            <div style="background:#fff;color:#000;padding:30px;text-align:center">
              <h2>${client.name}</h2>
              <p>${client.niche} | ${client.city}</p>
              <p>Current: ${client.website}</p>
            </div>
            <table width="100%" style="border-collapse:collapse">
              <tr>
                <td width="50%" style="background:#111;padding:20px;text-align:center">
                  <p style="color:#ff4444">❌ OLD WEBSITE</p>
                  <div style="background:#222;height:300px;border:2px solid red;display:flex;align-items:center;justify-content:center">
                    <div>Screenshot:<br>${client.website}<br><br>Slow / Old / No Booking</div>
                  </div>
                </td>
                <td width="50%" style="background:#000;padding:20px;text-align:center">
                  <p style="color:#00ff88">✅ NEW LUXURY PROPOSAL</p>
                  <div style="background:#fff;color:#000;height:300px;border:2px solid #00ff88;display:flex;align-items:center;justify-content:center">
                    <div><b>LUXURY BLACK/WHITE</b><br>Fast + Booking + SEO<br><br>3x More Clients</div>
                  </div>
                </td>
              </tr>
            </table>
            <div style="background:#fff;color:#000;padding:30px;text-align:center">
              <h3>WHAT YOU WILL GET - PREVIEW</h3>
              <a href="https://venus-ai-v7.vercel.app/live/houston-elite-plumber" style="background:#000;color:#fff;padding:15px 30px;text-decoration:none;display:inline-block;margin:10px">VIEW LIVE DEMO</a>
              <p style="font-size:12px;color:#666">Luxury Black/White • 1 sec load • Auto Booking • Mobile Elite</p>
            </div>
            <div style="background:#000;padding:40px;text-align:center">
              <a href="https://github.com/venusplaza7-dot/venus-ai-v7/actions" style="background:#fff;color:#000;padding:18px 40px;text-decoration:none;font-weight:bold">✅ APPROVE LUXURY</a>
              <p style="color:#555;font-size:10px;margin-top:20px">Control: 1 per 5 min, max 275/night | Venus Plaza</p>
            </div>
          </body></html>
          `;

          api.sendTransacEmail({
            sender: {email: 'luxury@venus-ai-v7.vercel.app', name: 'Venus Luxury'},
            to: [{email: process.env.OWNER_EMAIL}],
            subject: 'SAMPLE 1/275 - LUXURY Black/White - Before/After + Preview',
            htmlContent: html
          }).then(()=>console.log('SENT LUXURY')).catch(e=>console.log('ERR', e.response?.body || e.message));





