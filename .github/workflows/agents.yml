name: Venus - First Approval Then Autonomous
on:
  schedule:
    - cron: '*/5 * * * *' # 1 per 5 min
  workflow_dispatch:

jobs:
  send-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call proposal API
        run: |
          curl -s https://www.venushq7.com/api/proposal > result.json
          cat result.json
          # Save state back to Git so approval persists
          cp public/agent-state.json agent-state.json || true
          git config user.name "Venus Agents"
          git config user.email "agents@venushq7.com"
          git add agent-state.json public/agent-state.json result.json || true
          git diff --staged --quiet || git commit -m "Auto: proposal $(cat result.json | jq -r .sent) / 275"
          git push || true



