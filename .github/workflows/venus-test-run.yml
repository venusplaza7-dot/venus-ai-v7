
name: venus-test-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send Test Luxury Email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          node - << 'NODE'
          const resp = await fetch('https://api.brevo.com/v3/smtp/email', {
            method: 'POST',
            headers: {
              'api-key': process.env.BREVO_API_KEY,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              sender: { name: 'Venus HQ', email: 'ron@venushq7.com' },
              to: [{ email: 've9us1@gmail.com' }],
              subject: 'VENUS FIXED - OLD SITE 2016 TEST',
              htmlContent: '<div style="background:#000;color:#fff;padding:40px;font-family:sans-serif"><h1>Your new website is ready</h1><p>Who we are: Venus HQ - luxury AI sites</p><p>What is wrong: Site unchanged since 2016, missing Gen Z, no AI</p><a href="https://venus-agent-hq.vercel.app" style="background:#fff;color:#000;padding:12px 24px;text-decoration:none;display:inline-block;margin-top:20px">VIEW LIVE PREVIEW</a></div>'
            })
          });
          const text = await resp.text();
          console.log('STATUS', resp.status, text);
          if (!resp.ok) process.exit(1);
          NODE
