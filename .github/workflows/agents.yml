name: Venus Luxury B&W - Old vs New + GenZ AI
on: workflow_dispatch
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send 100 Luxury Black Proposals
        run: |
          node - <<'JS'
          const fs=require('fs');
          let sites=[];
          try{
            let raw=fs.readFileSync('site500.json','utf8');
            sites=JSON.parse(raw);
            if(!Array.isArray(sites)) sites=[sites];
          }catch{
            let raw=fs.readFileSync('site500.json','utf8');
            const m=[...raw.matchAll(/\{[^}]+\}/g)].map(x=>x[0]);
            sites=m.map(s=>{try{return JSON.parse(s)}catch{return null}}).filter(Boolean);
          }
          console.log(`Loaded ${sites.length} sites from site500.json`);
          (async()=>{
            const BREVO=process.env.BREVO_KEY;
            if(!BREVO){ console.log('No BREVO key'); return; }
            for(const s of sites.slice(0,100)){
              const domain=(s.domain||s.website||s.url||'').replace(/^https?:\/\//,'').split('/')[0]||'example.com';
              const email=s.email||`info@${domain}`;
              const name=s.company||s.name||domain.split('.')[0];
              if(!email.includes('@')) continue;
              let oldTitle=name, ping='slow';
              try{
                const t0=Date.now();
                const res=await fetch('https://'+domain,{signal:AbortSignal.timeout(8000)});
                ping=Date.now()-t0;
                const txt=await res.text();
                const mt=txt.match(/<title>(.*?)<\/title>/i);
                if(mt) oldTitle=mt[1].slice(0,80);
              }catch{ ping='legacy 2016'; }
              const slug=domain.replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,15);
              const newPreview=`https://venus-ai-v8.vercel.app/p/${slug}`;
              const oldPreview=`https://${domain}`;
              const waLink=`https://wa.me/17865880578?text=${encodeURIComponent(`Hi Ron, ${domain} old vs new - launch luxury GenZ in 24h - ${newPreview}`)}`;
              const html=`<div style="background:#0a0a0a;color:#fff;font-family:Helvetica,Arial,sans-serif;max-width:600px;margin:0 auto"><div style="padding:60px 30px 40px"><p style="font-size:10px;letter-spacing:4px;color:#666;margin:0">VENUS HQ — ${ping}ms AUDIT</p><h1 style="font-weight:200;font-size:48px;line-height:1;margin:20px 0">Your new<br>website is ready<br>for review.</h1><p style="color:#999;font-size:14px">We audited <span style="color:#fff">${domain}</span> — unchanged since 2016. No AI, losing Gen Z + luxury clients.</p></div><div style="border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;display:flex"><div style="width:50%;border-right:1px solid #1a1a1a;padding:24px"><p style="font-size:10px;letter-spacing:3px;color:#555">CURRENT — 2016</p><p style="font-size:12px;color:#888">${oldPreview}</p><p style="font-size:11px;color:#666">❌ ${oldTitle}<br>❌ ${ping} — slow<br>❌ No AI tool<br>❌ Gen Z bounces</p></div><div style="width:50%;padding:24px;background:#111"><p style="font-size:10px;letter-spacing:3px;color:#fff">PROPOSAL — 2026 LUXURY</p><p style="font-size:12px;color:#fff">${newPreview}</p><p style="font-size:11px;color:#fff">✓ Luxury B&W<br>✓ AI Concierge<br>✓ Visual Quote<br>✓ Voice Ops</p><a href="${newPreview}" style="margin-top:16px;display:inline-block;background:#fff;color:#000;padding:10px 18px;font-size:11px;text-decoration:none">VIEW LIVE PROPOSAL →</a></div></div><div style="background:#000;padding:60px 30px;text-align:center"><p style="font-size:40px;font-weight:200;margin:0 0 35px">Launch ${name}<br>within 24h.</p><a href="${waLink}" style="background:#fff;color:#000;padding:18px 36px;display:inline-block;text-decoration:none;font-size:11px;letter-spacing:3px;font-weight:700">CONFIRM VIA WHATSAPP</a><p style="color:#444;font-size:11px;margin:24px 0 0">DIRECT TO +1 (786) 588-0578 — ron@venushq7.com</p></div></div>`;
              const r=await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'api-key':BREVO,'Content-Type':'application/json'},body:JSON.stringify({sender:{email:'ron@venushq7.com',name:'Venus HQ'},replyTo:{email:'ron@venushq7.com'},to:[{email:email}],bcc:[{email:'ve9us1@gmail.com'}],subject:`${name} — ${domain} — 2016 vs luxury GenZ + AI — launch in 24h`,htmlContent:html})});
              console.log(`${domain} ${r.status}`);
              await new Promise(x=>setTimeout(x,2000));
            }
          })();
          JS
        env:
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
