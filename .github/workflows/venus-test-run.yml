name: venus-test-run

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel factory to send email
        run: |
          curl -X POST https://venus-agent-hq.vercel.app/api/scrap-trigger \
          -H "Content-Type: application/json" \
          -d '{"test": true, "to": "ve9us1@gmail.com"}'
          echo "Triggered Vercel - check Gmail in 30 sec"
