name: Venus - First Approval Then Autonomous
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install @getbrevo/brevo
      - name: Send Luxury Proposal
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OWNER_EMAIL: ve9us1@gmail.com
        run: |
          cat > /tmp/send.js <<'JS'
          const brevo = require('@getbrevo/brevo');
          const api = new brevo.TransactionalEmailsApi();
          api.setApiKey(0, process.env.BREVO_API_KEY);
          const html = `<div style="background:#000;color:#fff;font-family:Arial;padding:0"><div style="background:#000;padding:30px;text-align:center;border-bottom:2px solid #fff"><h1 style="letter-spacing:5px">VENUS AI</h1><p style="color:#888">LUXURY BLACK & WHITE</p></div><div style="background:#fff;color:#000;padding:20px;text-align:center"><h2>Houston Elite Plumber</h2></div><table width="100%" style="border-collapse:collapse"><tr><td width="50%" style="background:#111;padding:20px;text-align:center"><p style="color:red">❌ OLD</p><div style="background:#222;height:200px;padding:20px">Old Site<br>Slow No Booking</div></td><td width="50%" style="background:#000;padding:20px;text-align:center"><p style="color:#0f0">✅ NEW LUXURY</p><div style="background:#fff;color:#000;height:200px;padding:20px"><b>BLACK/WHITE FAST BOOKING</b></div></td></tr></table><div style="background:#fff;color:#000;padding:25px;text-align:center"><h3>WHAT YOU WILL GET - PREVIEW</h3><a href="https://venus-ai-v7.vercel.app/live/houston-elite-plumber" style="background:#000;color:#fff;padding:12px 25px;text-decoration:none">VIEW LIVE PREVIEW</a></div><div style="background:#000;padding:25px;text-align:center"><a href="https://github.com/venusplaza7-dot/venus-ai-v7/actions" style="background:#fff;color:#000;padding:14px 28px;text-decoration:none">APPROVE LUXURY</a></div></div>`;
          api.sendTransacEmail({sender:{email:'luxury@venus-ai-v7.vercel.app',name:'Venus Luxury'},to:[{email:process.env.OWNER_EMAIL}],subject:'SAMPLE 1/275 - LUXURY Before/After',htmlContent:html}).then(()=>console.log('SENT')).catch(e=>{console.error(e.response?.body||e.message);process.exit(1);});
          JS
          node /tmp/send.js
