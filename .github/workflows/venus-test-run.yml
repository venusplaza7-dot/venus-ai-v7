name: venus-test-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send Test Luxury Email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: $BREVO_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": {"name":"Venus HQ","email":"ron@venushq7.com"},
              "to": [{"email":"ve9us1@gmail.com"}],
              "subject":"VENUS LUXURY TEST - 2016 SITE + GEN Z",
              "htmlContent":"<div style=\"background:#000;color:#fff;padding:40px;font-family:sans-serif\"><h1>Your new website is ready for review</h1><p><b>Who we are:</b> Venus HQ - luxury AI sites</p><p><b>What is wrong:</b> Your site unchanged since 2016, missing Gen Z trust, no AI</p><a href=\"https://venus-agent-hq.vercel.app\" style=\"background:#fff;color:#000;padding:12px 24px;text-decoration:none;display:inline-block;margin-top:20px\">VIEW LIVE PREVIEW</a></div>"
