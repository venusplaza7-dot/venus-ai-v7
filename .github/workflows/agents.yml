name: Venus 100 - Old vs New + BCC Preview
on: workflow_dispatch
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          KEY=$(echo "${{ secrets.BREVO_API_KEY }}" | tr -d ' \n\r\t')
          node - <<'JS'
          const fs=require('fs');
          let sites=JSON.parse(fs.readFileSync('site500.json','utf8'));
          const batch=sites.slice(0,100);
          (async()=>{
            const KEY=process.env.BREVO_KEY;
            let sent=0;
            for(const s of batch){
              const domain = typeof s==='string'? s : (s.domain || s.website);
              const email = typeof s==='string'? 'info@'+s : (s.email);
              const name = s.name || domain;
              if(!email) continue;
              let ping='N/A'; try{ const t0=Date.now(); await fetch('https://'+domain.replace(/^https?:\/\//,''),{signal:AbortSignal.timeout(8000)}); ping=Date.now()-t0; }catch(e){ ping='slow'; }
              const slug=domain.replace(/[^a-z0-9]/gi,'').toLowerCase().slice(0,15);
              const newPreview=`https://venus-upgrade-${slug}.vercel.app`;
              const html=`<div style="font-family:Arial;padding:20px"><h2>Quick preview for ${name}</h2><p>I checked ${domain} - ping ${ping}ms - made 2026 version:</p><table width="100%"><tr><td style="border:1px solid #ccc;padding:10px">BEFORE<br>${domain}<br>Slow, old</td><td style="border:2px solid #00ff88;padding:10px">AFTER<br><a href="${newPreview}">${newPreview}</a><br>90+ speed, Mobile, Booking</td></tr></table><a href="${newPreview}" style="background:#00ff88;color:#000;padding:12px 20px;display:inline-block;margin-top:15px">View Preview</a><p>$500 setup + $300/mo - reply to make live</p><p>Ron - Venus HQ</p></div>`;
              const r=await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'api-key':KEY,'Content-Type':'application/json'},body:JSON.stringify({sender:{email:'ron@venushq7.com',name:'Venus HQ'},replyTo:{email:'ve9us1@gmail.com'},to:[{email:email}],bcc:[{email:'ron@venushq7.com'}],subject:`Quick preview - upgraded ${name} - old vs new`,htmlContent:html})});
              console.log(`${email} -> ${r.status}`); if(r.ok) sent++; await new Promise(x=>setTimeout(x,1500));
            } console.log('DONE',sent);
          })();
          JS
        env:
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
