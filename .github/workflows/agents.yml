name: Venus Anonymous Factory
on:
  push:
    paths:
      - 'venus-agent-hq/factory/clients.txt'
  workflow_dispatch:

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run Anonymous Scraper
        run: |
          cd venus-agent-hq
          npm install puppeteer || true
          node factory/make-live.js
          node factory/agent.js
      
      - name: Commit Proposal JSON
        run: |
          git config --global user.email "agent@venus.ai"
          git config --global user.name "Venus Agent"
          git add venus-agent-hq/factory/*.json
          git diff --cached --quiet || git commit -m "autonomous proposal $(date +%s)"
          git push || true







