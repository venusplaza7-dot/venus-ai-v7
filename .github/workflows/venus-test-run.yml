name: TEST - Luxury Ron to Ve9us Only
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node - <<'JS'
          (async()=>{
            const KEY=process.env.BREVO_KEY;
            const html=require('fs').readFileSync('./luxury-final-test.html','utf8');
            // If file not in repo, use inline luxury
            const finalHtml = html || `<div style="background:#0a0a0a;color:#fff;max-width:600px;margin:0 auto;font-family:Helvetica;padding:50px"><h1 style="font-weight:200;font-size:44px">Your new website is ready for review.</h1><p style="color:#999">We audited houston-elite-plumber.com — unchanged since 2016.</p><a href="https://venus-ai-v8.vercel.app" style="background:#fff;color:#000;padding:12px 20px;display:inline-block;margin-top:20px;text-decoration:none">VIEW LIVE PROPOSAL →</a><br><br><a href="https://wa.me/17865880578" style="background:#fff;color:#000;padding:16px 30px;display:inline-block;text-decoration:none;font-weight:700;letter-spacing:3px">CONFIRM VIA WHATSAPP</a></div>`;
            const res=await fetch('https://api.brevo.com/v3/smtp/email',{
              method:'POST',
              headers:{'api-key':KEY,'Content-Type':'application/json'},
              body:JSON.stringify({
                sender:{email:'ron@venushq7.com',name:'Venus HQ'},
                replyTo:{email:'ron@venushq7.com'},
                to:[{email:'ve9us1@gmail.com'}],
                subject:'TEST - houston-elite-plumber.com — luxury B&W — neat proposal — 24h launch',
                htmlContent: finalHtml
              })
            });
            console.log('TEST SEND STATUS', res.status);
            console.log(await res.text());
          })();
          JS
        env:
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }
