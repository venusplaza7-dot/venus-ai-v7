name: Venus - Old Site Hunter FIXED
on: workflow_dispatch
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Hunt Old 2016 Sites
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OWNER_EMAIL: ve9us1@gmail.com
          SENDER_EMAIL: ron@venushq7.com
        run: |
          cat > hunter.js <<'JS'
          (async () => {
            console.log('START HUNTER - NO SERPAPI NEEDED');
            const url = "http://houstoneliteplumber.com";
            console.log('CHECKING', url);
            
            let html = "";
            try {
              html = await fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}}).then(r=>r.text());
              console.log('Got HTML length', html.length);
            } catch(e){ console.log('Fetch failed, using mock HTML'); html = "<title>Houston Elite Plumber</title><table cellpadding=0>Copyright 2014"; }

            const isOld = !html.includes('viewport') || html.includes('cellpadding');
            console.log('IS OLD?', isOld);

            const name = "Houston Elite Plumber";
            const slug = "venus-houston-elite-plumber-test";
            const liveUrl = `https://venus-hq.vercel.app/${slug}`;
            const oldShot = `https://image.thum.io/get/width/700/crop/800/noanimate/${url}`;
            const newShot = `https://image.thum.io/get/width/700/crop/800/noanimate/${liveUrl}`;

            const htmlEmail = `<!DOCTYPE html><body style="margin:0;background:#f4f4f4;font-family:Arial"><div style="max-width:680px;margin:auto;background:#fff">
            <div style="background:#000;padding:30px;text-align:center"><h1 style="color:#fff;letter-spacing:10px;margin:0">VENUS HQ</h1><p style="color:#777;font-size:10px">FOUND YOUR 2016 SITE</p></div>
            <div style="padding:35px"><h1 style="font-size:40px;font-weight:300">Your new website<br><b>is ready.</b></h1>
            <p>Hi <b>${name}</b>,</p>
            <p>We came across <b>${url}</b> in Houston and found it <b>very old — HTML from 2016 or before.</b></p>
            <p>In today's world, <b>Gen Z doesn't call — they click.</b> AI booking, voice search one click away.</p>
            <p>We rebuilt it — luxury — live now.</p></div>
            <table width="100%" style="border:1px solid #000"><tr>
            <td width="50%" style="padding:10px;background:#fafafa;text-align:center"><p style="color:#c00;font-weight:900">❌ YOUR 2016 OLD SITE</p><img src="${oldShot}" style="width:100%"></td>
            <td width="50%" style="padding:10px;background:#000;text-align:center"><p style="color:#0f8;font-weight:900">✅ NEW LUXURY AI</p><img src="${newShot}" style="width:100%;border:2px solid #fff"></td></tr></table>
            <div style="padding:30px;text-align:center"><a href="${liveUrl}" style="background:#000;color:#fff;padding:18px 36px;text-decoration:none;font-weight:900">VIEW LIVE PROPOSAL →</a></div>
            <div style="background:#000;padding:25px;text-align:center"><p style="color:#fff;margin:0">+1 (786) 588-0578 | ron@venushq7.com</p></div></div></body></html>`;

            console.log('SENDING TO', process.env.OWNER_EMAIL, 'FROM', process.env.SENDER_EMAIL);
            const res = await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'accept':'application/json','api-key':process.env.BREVO_API_KEY,'content-type':'application/json'},body:JSON.stringify({sender:{name:'Ron - Venus HQ',email:process.env.SENDER_EMAIL},to:[{email:process.env.OWNER_EMAIL}],subject:`[APPROVAL 1/10] TEST OLD SITE ${name}`,htmlContent:htmlEmail})});
            const txt = await res.text();
            console.log('BREVO STATUS', res.status);
            console.log('BREVO RESPONSE', txt);
            if(!res.ok){ console.log('FAILED'); process.exit(1); }
            console.log('SUCCESS SENT');
          })();
          JS
          node hunter.js
