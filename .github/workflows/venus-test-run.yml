name: venus-test-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          node -e "
          console.log('KEY EXISTS:', !!process.env.BREVO_API_KEY, 'LEN:', (process.env.BREVO_API_KEY||'').length);
          "
