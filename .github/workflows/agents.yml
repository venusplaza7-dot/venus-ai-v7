name: Venus Send 100 Tonight
on: workflow_dispatch
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - run: |
          KEY=$(echo "${{ secrets.BREVO_API_KEY }}" | tr -d ' \n\r\t')
          echo "Key length after trim: ${#KEY}"
          curl -X POST https://api.brevo.com/v3/smtp/email \
          -H "api-key: $KEY" \
          -H "Content-Type: application/json" \
          -d '{"sender":{"email":"ron@venushq7.com","name":"Venus HQ"},"to":[{"email":"ve9us1@gmail.com"}],"subject":"Trimmed key test","htmlContent":"<p>Trimmed - should land</p>"}' -v 
