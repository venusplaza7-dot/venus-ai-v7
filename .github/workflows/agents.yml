name: venus-test-run

on:
  workflow_dispatch:

jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Run Venus Factory Test
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install
          npm run test:send --to=ve9us1@gmail.com
