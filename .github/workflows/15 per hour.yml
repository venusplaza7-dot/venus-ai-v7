name: 15-per-hour
on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:
jobs:
  send-real:
    runs-on: ubuntu-latest
    steps:
      - name: Send 1 real luxury lead
        run: |
          echo "Calling venus-ai-v8..."
          curl -L -s "https://venus-ai-v8.vercel.app/api/real?force=true" | tee out.json
          cat out.json
          curl -L -s "https://venus-ai-v8.vercel.app/api/cron/auto?key=venus13" | tee auto.json
          cat auto.json
