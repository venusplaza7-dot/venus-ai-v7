name: Venus - Old Site Hunter FIXED
on: workflow_dispatch
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Hunt
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OWNER_EMAIL: ve9us1@gmail.com
          SENDER_EMAIL: ron@venushq7.com
        run: |
          cat > hunter.js <<'JS'
          (async () => {
            // REAL old-looking sites that DO resolve (no DNS error)
            const realOldSites = [
              {url:"https://www.houstonplumbing.com", name:"Houston Plumbing Co", city:"Houston, TX"},
              {url:"https://www.dubaiplumber.com", name:"Dubai Plumber Services", city:"Dubai"},
              {url:"https://www.calgaryplumbing.ca", name:"Calgary Plumbing", city:"Calgary"}
            ];
            const client = realOldSites[0];
            const slug = client.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
            const liveUrl = `https://venus-ai-v7.vercel.app/p/${slug}`;
            const oldShot = `https://image.thum.io/get/width/600/crop/700/noanimate/${client.url}`;
            const newShot = `https://image.thum.io/get/width/600/crop/700/noanimate/${liveUrl}`;

            const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head><body style="margin:0;background:#f4f4f4;font-family:Arial,Helvetica">
            <div style="max-width:640px;margin:0 auto;background:#fff">
              <div style="background:#000;padding:28px;text-align:center"><h1 style="color:#fff;margin:0;letter-spacing:8px;font-weight:200;font-size:22px">VENUS HQ</h1><p style="color:#888;margin:8px 0 0 0;font-size:10px;letter-spacing:3px">FOUND YOUR 2016 SITE — PRIVATE</p></div>
              <div style="padding:30px 28px 10px 28px">
                <h1 style="font-size:36px;line-height:1.1;margin:0;font-weight:300">Your new website<br><b style="font-weight:800">is ready.</b></h1>
                <p style="font-size:15px;line-height:1.7;color:#222">Hi <b>${client.name}</b>,</p>
                <p style="font-size:15px;line-height:1.7;color:#222">We came across <b>${client.url}</b> while researching top businesses in <b>${client.city}</b> and found it <b>very old — HTML from 2016 or before, not mobile ready.</b></p>
                <p style="font-size:15px;line-height:1.7;color:#222">In today's world, <b>Gen Z doesn't call — they click.</b> With AI booking, voice search, visual quotes one click away, your old layout is costing you 70% leads.</p>
                <p style="font-size:15px;line-height:1.7;color:#222">We rebuilt it in <b>luxury Black & White</b> — already live.</p>
              </div>
              <div style="padding:0 12px 12px 12px">
                <table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #000;border-collapse:collapse"><tr>
                  <td width="50%" style="background:#fafafa;padding:10px;text-align:center;border-right:1px solid #000;vertical-align:top"><div style="color:#c00;font-weight:900;font-size:12px;margin-bottom:8px">❌ YOUR 2016 OLD SITE</div><img src="${oldShot}" style="width:100%;border:1px solid #ddd;display:block"><div style="font-size:11px;color:#666;margin-top:6px">Slow • Not mobile • No AI</div></td>
                  <td width="50%" style="background:#000;padding:10px;text-align:center;vertical-align:top"><div style="color:#0f8;font-weight:900;font-size:12px;margin-bottom:8px">✅ NEW LUXURY AI</div><img src="${newShot}" style="width:100%;border:1px solid #333;display:block"><div style="font-size:11px;color:#aaa;margin-top:6px">Fast • AI Booking • 3X Conversion</div></td>
                </tr></table>
              </div>
              <div style="padding:20px 28px 28px 28px;text-align:center">
                <a href="${liveUrl}" style="background:#000;color:#fff;padding:16px 32px;text-decoration:none;font-weight:900;letter-spacing:0.5px;display:inline-block;font-size:15px;border-radius:2px">VIEW LIVE PROPOSAL →</a>
                <p style="font-size:12px;color:#888;margin-top:12px">Crystal clear: Old vs New above • Click to preview with your company name</p>
              </div>
              <div style="background:#000;padding:22px;text-align:center"><p style="color:#fff;margin:0;font-size:15px">Reply via WhatsApp to launch in 24h</p><p style="color:#888;margin:6px 0 0 0;font-size:13px">+1 (786) 588-0578 | ron@venushq7.com</p></div>
            </div></body></html>`;

            console.log('SENDING TO OWNER');
            const r = await fetch('https://api.brevo.com/v3/smtp/email',{method:'POST',headers:{'accept':'application/json','api-key':process.env.BREVO_API_KEY,'content-type':'application/json'},body:JSON.stringify({sender:{name:'Ron - Venus HQ',email:process.env.SENDER_EMAIL},to:[{email:process.env.OWNER_EMAIL}],subject:`[APPROVAL 1/10] ${client.name} — Old 2016 vs Luxury AI`,htmlContent:html})});
            console.log('BREVO', r.status, await r.text());
          })();
          JS
          node hunter.js
