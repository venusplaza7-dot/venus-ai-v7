name: Fancy Luxury Proposal Sender

on:
  workflow_dispatch:
    inputs:
      company:
        description: 'Company name'
        required: true
        default: 'Alliance Plumbing Houston'
      slug:
        description: 'Slug'
        required: true
        default: 'alliance-plumbing-houston'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Fancy Orange + Black Proposal
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ inputs.company }} — Your Luxury Site Is Ready (Private Preview) — $1997→$497
          from: Venus HQ <${{ secrets.MAIL_USERNAME }}>
          to: Venusplaza7@gmail.com
          html_body: |
            <!DOCTYPE html>
            <html><body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,sans-serif;">
            <center style="width:100%;background:#f4f4f5;padding:24px 0;">
            <div style="max-width:600px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e4e4e7;">
            <div style="padding:20px 32px 0 32px;">
            <p style="margin:0;font-size:10px;letter-spacing:2px;color:#71717a;font-weight:700;">VENUS HQ — PRIVATE AUDIT SINCE 2016 FOR ${{ inputs.company }}</p>
            <h1 style="margin:12px 0 0 0;font-size:24px;color:#18181b;font-weight:800;">Your site is unchanged since 2016 — losing Gen Z.</h1>
            </div>
            <div style="margin:24px;background:#0a0a0a;border-radius:16px;border:1px solid #FFB86A33;padding:32px;">
            <p style="margin:0 0 8px 0;font-size:11px;letter-spacing:3px;color:#FFB86A;font-weight:800;">YOUR NEW LUXURY SITE IS READY</p>
            <p style="margin:0 0 20px 0;"><span style="color:#71717a;text-decoration:line-through;font-size:18px;">$1,997</span> <span style="color:#71717a;">→</span> <span style="color:#FFB86A;font-size:36px;font-weight:900;">$497</span> <span style="margin-left:8px;color:#FFB86A;font-size:11px;border:1px solid #FFB86A66;padding:4px 8px;border-radius:20px;">48H SPECIAL</span></p>
            <a href="https://venus-agent-hq.vercel.app/p/${{ inputs.slug }}" style="display:block;background:#FFB86A;color:#000;text-decoration:none;font-weight:800;font-size:14px;text-align:center;padding:16px 24px;border-radius:8px;margin-bottom:12px;">CLICK HERE TO PREVIEW YOUR NEW WEBSITE →</a>
            <a href="https://api.whatsapp.com/send?phone=17865880578&text=APPROVE%20${{ inputs.slug }}%20FOR%20497" style="display:block;background:#25D366;color:#fff;text-decoration:none;font-weight:800;font-size:14px;text-align:center;padding:16px 24px;border-radius:8px;">CONFIRM VIA WHATSAPP - $497 →</a>
            <div style="margin-top:24px;border-top:1px solid #27272a;padding-top:20px;">
            <p style="margin:0 0 8px 0;color:#e4e4e7;font-size:13px;">✓ AI Concierge 24/7 — answers & books</p>
            <p style="margin:0 0 8px 0;color:#e4e4e7;font-size:13px;">✓ Visual Quote — upload photo → instant price</p>
            <p style="margin:0 0 8px 0;color:#e4e4e7;font-size:13px;">✓ 20-min Booking + WhatsApp</p>
            <p style="margin:0;color:#a1a1aa;font-size:12px;">✓ Old site stays live until you approve</p>
            </div>
            </div>
            </div>
            <div style="padding:0 32px 32px 32px;"><p style="font-size:12px;color:#71717a;">Old site stays live until approve.</p><p style="font-size:12px;color:#18181b;font-weight:700;">— Venus HQ Since 2016</p></div>
            </div>
            </center>
            </body></html>
