name: v8-15-per-hour
on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Venus API 15 per hour
        run: |
          curl -s "https://venus-ai-v8.vercel.app/api/real?force=1&cat=roofers" 
          echo "Sent roofer"
          curl -s "https://venus-ai-v8.vercel.app/api/real?force=1&cat=plumbers"
          echo "Sent plumber"
  
