name: venus-agent-v8
on:
  workflow_dispatch:

jobs:
  run-v8-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Run Factory
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PREVIEW_DOMAIN: https://venus-ai-v8-git-main-venus13.vercel.app
        run: node factory/agent.js
